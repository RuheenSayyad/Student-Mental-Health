name: Lab 13 - End-to-End MLOps Continuous Monitoring & Retraining

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

jobs:
  mlops-monitoring:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run MLOps monitoring trigger
        run: python src/mlops_pipeline/12_monitor_trigger.py

      - name: Show monitoring result
        if: always()
        run: |
          if [ -f "outputs/monitoring/monitor_trigger_report.json" ]; then
            cat outputs/monitoring/monitor_trigger_report.json
          else
            echo "Monitoring report was not generated."
          fi

      - name: Upload monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab13-monitoring-${{ github.run_number }}
          path: |
            outputs/**
            reports/**
            artifacts/**
            logs/**
          if-no-files-found: ignore
